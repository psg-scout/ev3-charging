<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- EV3 Charging app icon: bolt-in-location-pin on a deep teal-black gradient. Full-bleed square; iOS applies its own mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#12343a"/>
      <stop offset="0.55" stop-color="#0a1d24"/>
      <stop offset="1" stop-color="#04090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#39f5c9" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#1fb894" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1fb894" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6f4f1"/>
      <stop offset="1" stop-color="#b9d3cf"/>
    </linearGradient>
    <linearGradient id="pinHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d4ff4a"/>
      <stop offset="0.55" stop-color="#5cf2a8"/>
      <stop offset="1" stop-color="#14c7b4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dy="30" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="well" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#0f3036"/>
      <stop offset="1" stop-color="#040d11"/>
    </radialGradient>
    <clipPath id="pinClip"><path id="pinShape" d="M488 856 C428 778 286 632 286 452 A226 226 0 1 1 738 452 C738 632 596 778 536 856 Q512 888 488 856 Z"/></clipPath>
  </defs>

  <!-- background layer -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- faint road arc for context (map/driving) -->
  <path d="M-40 930 C 260 780, 760 800, 1080 640" fill="none" stroke="#39f5c9" stroke-opacity="0.10" stroke-width="54" stroke-linecap="round"/>
  <path d="M-40 930 C 260 780, 760 800, 1080 640" fill="none" stroke="#39f5c9" stroke-opacity="0.22" stroke-width="6" stroke-dasharray="34 30" stroke-linecap="round"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- foreground: pin -->
  <g filter="url(#shadow)">
    <path d="M488 856 C428 778 286 632 286 452 A226 226 0 1 1 738 452 C738 632 596 778 536 856 Q512 888 488 856 Z" fill="url(#pin)"/>
  </g>
  <!-- specular highlight on top half of pin -->
  <g clip-path="url(#pinClip)">
    <ellipse cx="470" cy="300" rx="250" ry="150" fill="url(#pinHi)" opacity="0.55"/>
  </g>
  <path d="M488 856 C428 778 286 632 286 452 A226 226 0 1 1 738 452 C738 632 596 778 536 856 Q512 888 488 856 Z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5"/>

  <!-- dark well in the pin head -->
  <circle cx="512" cy="452" r="160" fill="url(#well)"/>
  <circle cx="512" cy="452" r="160" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="10"/>

  <!-- accent: bolt -->
  <path filter="url(#boltGlow)" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="24" stroke-linejoin="round"
        d="M556 326 L440 486 L506 486 L470 590 L590 420 L524 420 Z"/>
  <path fill="none" stroke="#f4ffd0" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" d="M548 336 L452 470"/>
</svg>
